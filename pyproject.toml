[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="brickforge"
version="0.1.0"
description="BrickForge AI Parts Engine"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn>=0.30,<1","pydantic>=2.8,<3"]
[project.optional-dependencies]
dev=["pytest>=8,<9","httpx>=0.27,<1"]
[project.scripts]
brickforge="brickforge.cli:main"
[tool.setuptools]
package-dir={""="services/parts_engine/src"}
[tool.setuptools.packages.find]
where=["services/parts_engine/src"]
[tool.pytest.ini_options]
testpaths=["tests/python"]
addopts="-q"
